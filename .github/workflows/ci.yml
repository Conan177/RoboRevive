name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permessi minimi per tutto il workflow: i job che ne servono di più li dichiarano da soli.
permissions:
  contents: read

jobs:
  test-logica:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: logica

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: logica/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegui i test con coverage
        run: npm run test:coverage

      - name: Carica il report di coverage come artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: logica/coverage/

  test-simulatore:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docker/simulatore

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docker/simulatore/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegui i test unitari e property-based con coverage
        run: npm run test:coverage

      - name: Carica il report di coverage come artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-simulatore
          path: docker/simulatore/coverage/

  test-integrazione-simulatore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: docker/simulatore

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docker/simulatore/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      # I runner ubuntu-latest hanno Docker: testcontainers avvia Mosquitto da solo.
      - name: Esegui i test di integrazione con Mosquitto reale
        run: npm run test:integration

  smoke-test-simulatore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: docker/simulatore

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Build dell'immagine e smoke test (broker, simulatore, heartbeat)
        run: bash smoke-test.sh

  # Continuous Delivery: se tutti i test passano su main, l'immagine del simulatore
  # viene pubblicata (versionata con lo SHA del commit). Il rilascio sul target
  # resta manuale: docker compose pull && docker compose up -d.
  pubblica-immagine:
    needs:
      - test-logica
      - test-simulatore
      - test-integrazione-simulatore
      - smoke-test-simulatore
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      # GHCR accetta solo nomi di immagine in minuscolo.
      - name: Calcola il nome dell'immagine
        run: echo "IMMAGINE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/roborevive-simulatore" >> "$GITHUB_ENV"

      - name: Login al registro GitHub (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push dell'immagine del simulatore
        uses: docker/build-push-action@v7
        with:
          context: docker/simulatore
          push: true
          tags: |
            ${{ env.IMMAGINE }}:latest
            ${{ env.IMMAGINE }}:${{ github.sha }}
