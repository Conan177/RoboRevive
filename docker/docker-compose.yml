services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: roborevive-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    container_name: roborevive-node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red/data:/data
      - ../logica:/data/logica:ro
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log: