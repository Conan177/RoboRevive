services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: roborevive-mosquitto
    ports:
      - "127.0.0.1:1883:1883"
    env_file: .env
    command: >
      sh -c  "rm -f /tmp/passwd &&
             mosquitto_passwd -b -c /tmp/passwd gateway \"$$MQTT_PASS_GATEWAY\" &&
             mosquitto_passwd -b /tmp/passwd nodered \"$$MQTT_PASS_NODERED\" &&
             mosquitto_passwd -b /tmp/passwd admin \"$$MQTT_PASS_ADMIN\" &&
             chown mosquitto:mosquitto /tmp/passwd &&
             cp /mosquitto/config/acl /tmp/acl &&
             chown mosquitto:mosquitto /tmp/acl &&
             chmod 0700 /tmp/acl &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    container_name: roborevive-node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red/data:/data
      - ../logica:/data/logica:ro
    depends_on:
      - mosquitto
    restart: unless-stopped
  
  simulatore:
    build: ./simulatore
    container_name: roborevive-simulatore
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      INTERVALLO_HEARTBEAT_S: 30
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
